contents:
  # Requires HTTP_AUTH=basic:apk.cgr.dev:user:$(chainctl auth token --audience apk.cgr.dev)
  repositories:
    - https://apk.cgr.dev/gitguardian.com

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: nonroot

work-dir: /home/nonroot

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.licenses: 'MIT'
  org.opencontainers.image.vendor: 'GitGuardian'
  org.opencontainers.image.authors: 'GitGuardian SRE Team <sre@gitguardian.com>'
  org.opencontainers.image.source: 'https://github.com/GitGuardian/wolfi'
