name: static

on:
  schedule:
    - cron: "00 01 * * 1-5"
  pull_request:
    paths:
      - .github/workflows/static.yaml
      - 'images/static/*.yaml'
      - 'images/static/**/*.yaml'
  push:
    branches:
      - 'main'
    paths:
      - .github/workflows/static.yaml
      - 'images/static/*.yaml'
      - 'images/static/**/*.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  security-events: write
  actions: read

jobs:
  publish:
    strategy:
      matrix:
        version: [latest]
        variant: [prod]
    name: ${{ matrix.version }}
    uses: './.github/workflows/release.yaml'
    with:
      tag: ${{ matrix.version }}
      target: ${{ matrix.variant }}
    secrets: inherit
