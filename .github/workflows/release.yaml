name: Reusable release workflow

on:
  workflow_call:
    inputs:
      repository:
        description: 'Image repository'
        type: string
        required: false
        default: gitguardian/wolfi/${{ github.workflow }}
      tag:
        description: 'Image tag'
        type: string
        required: false
        default: 'latest'
      config-dir:
        description: 'Config directory'
        type: string
        required: false
        default: images/${{ github.workflow }}
      target:
        description: 'Image target'
        type: string
        required: false
        default: 'prod'
      packages:
        description: 'Additional packages'
        type: string
        required: false
        default: ''
      archs:
        description: 'Architectures'
        type: string
        required: false
        default: 'amd64,arm64'
      scan:
        description: 'Enable scan'
        type: string
        required: false
        default: 'true'

jobs:
  publish:
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write

    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      registry: ${{ steps.vars.outputs.registry }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3
      - name: Checkout
        uses: actions/checkout@v6

      # Assumes a Chainguard identity via GitHub OIDC and exports HTTP_AUTH for apk.cgr.dev/gitguardian.com.
      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}
          env-auth: true

      - name: Set Vars
        id: vars
        shell: bash
        run: |
          export REGISTRY="ghcr.io"
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            export REGISTRY="ttl.sh"
          fi
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "image=${REGISTRY}/${{ inputs.repository }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - if: steps.vars.outputs.registry == 'ghcr.io'
        name: Login to GitHub Registry
        uses: docker/login-action@v3
        id: login-to-registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create SBOM directory
        id: output
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/sbom

      # Same as distroless/actions/apko-publish@v1.0.0, which doesn't forward HTTP_AUTH to the apko container.
      - name: Publish image
        id: apko
        shell: bash
        env:
          # apko >= v1.4.6 rejects Wolfi packages with capitals in their name (libLLVM-19 via postgresql-18-dev):
          # https://github.com/chainguard-dev/apko/issues/2544 — last sdk with apko v1.4.5.
          # Drop the pin once https://github.com/chainguard-dev/apko/pull/2541 ships in the sdk.
          APKO_IMAGE: ghcr.io/wolfi-dev/sdk@sha256:934a55660cb64ab718b5ada25f14ac1ab810705ec8849268907b668120cf3042
          CONFIG: ${{ inputs.config-dir }}/${{ inputs.target }}.yaml
          TAG: ${{ steps.vars.outputs.image }}
          PACKAGES: ${{ inputs.packages }}
          ARCHS: ${{ inputs.archs }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --network host \
            -v "$PWD:$PWD" -v /tmp:/tmp -w "$PWD" \
            -e HTTP_AUTH -e GITHUB_TOKEN -e "GITHUB_ACTOR=${{ github.repository_owner }}" \
            --entrypoint /usr/bin/apko "$APKO_IMAGE" \
            publish --vcs=false --image-refs=/tmp/apko.images \
              "$CONFIG" "$TAG" \
              ${PACKAGES:+-p "$PACKAGES"} ${ARCHS:+--arch "$ARCHS"} \
              --sbom-path=${{ github.workspace }}/sbom

      - id: digest
        shell: bash
        run: |
          echo "digest=$(crane digest ${{ steps.vars.outputs.image }})" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.archs }}" == *"amd64"* ]]; then
              echo "digest-amd64=$(crane digest --platform=linux/amd64 ${{ steps.vars.outputs.image }})" >> $GITHUB_OUTPUT
          else
              echo "digest-amd64=''" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ inputs.archs }}" == *"arm64"* ]]; then
              echo "digest-arm64=$(crane digest --platform=linux/arm64 ${{ steps.vars.outputs.image }})" >> $GITHUB_OUTPUT
          else
              echo "digest-arm64=''" >> $GITHUB_OUTPUT
          fi

      - if: steps.vars.outputs.registry != 'ttl.sh'
        name: Sign image
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            --recursive \
            --oidc-provider=github-actions \
            ${{ steps.vars.outputs.registry }}/${{ inputs.repository }}@${{ steps.digest.outputs.digest }}

      - if: steps.vars.outputs.registry != 'ttl.sh'
        name: Attest index SBOM
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --type=spdxjson \
            --predicate=${{ github.workspace }}/sbom/sbom-index.spdx.json \
            --oidc-provider=github-actions \
            ${{ steps.vars.outputs.registry }}/${{ inputs.repository }}@${{ steps.digest.outputs.digest }}

      - if: steps.vars.outputs.registry != 'ttl.sh' && steps.digest.outputs.digest-amd64 != ''
        name: Attest amd64 SBOM
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --type=spdxjson \
            --predicate=${{ github.workspace }}/sbom/sbom-x86_64.spdx.json \
            --oidc-provider=github-actions \
            ${{ steps.vars.outputs.registry }}/${{ inputs.repository }}@${{ steps.digest.outputs.digest-amd64 }}

      - if: steps.vars.outputs.registry != 'ttl.sh' && steps.digest.outputs.digest-arm64 != ''
        name: Attest arm64 SBOM
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --type=spdxjson \
            --predicate=${{ github.workspace }}/sbom/sbom-aarch64.spdx.json \
            --oidc-provider=github-actions \
            ${{ steps.vars.outputs.registry }}/${{ inputs.repository }}@${{ steps.digest.outputs.digest-arm64 }}

      - if: steps.vars.outputs.registry == 'ghcr.io'
        name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.vars.outputs.registry }}/${{ inputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  slsa:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      id-token: write
      packages: write
    needs: publish
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  scan:
    if: inputs.scan == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan image
        id: scan
        uses: anchore/scan-action@v7
        with:
          image: ${{ needs.publish.outputs.image }}
          cache-db: true
          fail-build: 'false'
          severity-cutoff: 'high'
          #grype-version: v0.87.0

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ github.workflow }}
